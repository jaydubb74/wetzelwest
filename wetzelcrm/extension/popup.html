<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Personal CRM - Add Contact</title>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    h2 {
      margin: 0 0 15px 0;
      color: #0066cc;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    select { cursor: pointer; }

    textarea {
      min-height: 60px;
      resize: vertical;
      font-family: inherit;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #saveBtn { background-color: #0066cc; color: white; }
    #saveBtn:hover { background-color: #0052a3; }
    #saveBtn:disabled { background-color: #ccc; cursor: not-allowed; }

    #extractBtn { background-color: #28a745; color: white; }
    #extractBtn:hover { background-color: #218838; }
    #extractBtn:disabled { background-color: #ccc; cursor: not-allowed; }

    .status {
      padding: 8px;
      margin: 10px 0;
      border-radius: 4px;
      display: none;
    }
    .status.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status.error   { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    #authBanner {
      background: #fff3cd;
      color: #856404;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      border: 1px solid #ffc107;
      display: none;
    }
    #authBanner a { color: #856404; font-weight: bold; }

    .source-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .source-linkedin { background-color: #0077b5; color: white; }

    .company-match { font-size: 12px; color: #666; margin-top: 2px; }
    .new-company    { color: #28a745; }
    .existing-company { color: #0066cc; }
  </style>
</head>
<body>
  <h2>Personal CRM</h2>

  <div id="authBanner">
    🔒 Not logged in. <a href="#" id="loginLink">Click here to log in to WetzelCRM</a>
  </div>

  <div id="statusMessage" class="status"></div>

  <div id="sourceBadge"></div>
  <div id="restoredBadge" style="display:none; font-size:12px; color:#666; margin-bottom:8px; font-style:italic;">
    📝 Form data restored from previous session
  </div>

  <div class="form-group">
    <label for="firstName">First Name *</label>
    <input type="text" id="firstName">
  </div>

  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName">
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email">
  </div>

  <div class="form-group">
    <label for="phone">Phone</label>
    <input type="tel" id="phone">
  </div>

  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title">
  </div>

  <div class="form-group">
    <label for="company">Company *</label>
    <select id="company">
      <option value="">-- Select a company --</option>
    </select>
    <div id="companyMatch" class="company-match"></div>
  </div>

  <div class="form-group">
    <label for="newCompany">Or Enter New Company Name</label>
    <input type="text" id="newCompany" placeholder="Type new company name here">
  </div>

  <div class="form-group">
    <label for="relationship">Relationship Type *</label>
    <select id="relationship">
      <option value="">-- Select relationship --</option>
    </select>
  </div>

  <div class="form-group">
    <label for="linkedinUrl">LinkedIn Profile URL</label>
    <input type="url" id="linkedinUrl" readonly>
  </div>

  <div class="form-group">
    <label for="notes">Notes</label>
    <textarea id="notes" placeholder="Additional information..."></textarea>
  </div>

  <div class="button-group">
    <button type="button" id="extractBtn">Re-Extract Data</button>
    <button type="button" id="saveBtn">Save Contact</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
