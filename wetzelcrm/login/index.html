<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WetzelCRM — Login</title>
  <meta name="description" content="WetzelCRM — Sign in to your CRM." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas:   #F4F6F8;
      --surface:  #FFFFFF;
      --sidebar:  #0F172A;
      --ink:      #0F172A;
      --muted:    #64748B;
      --border:   #E2E8F0;
      --blue:     #3B82F6;
      --blue-deep:#2563EB;
      --red:      #EF4444;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--sidebar);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 1.75rem;
      text-decoration: none;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      background: var(--blue);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .login-logo {
      width: 140px;
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
    }

    .login-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 4px 16px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .card-header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .card-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }

    .card-header p {
      font-size: 0.83rem;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: var(--ink);
      font-size: 0.82rem;
      letter-spacing: 0.01em;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--ink);
      background: var(--canvas);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--blue);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 0.5rem;
      letter-spacing: 0.01em;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .login-btn:hover {
      background: var(--blue-deep);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.38);
    }

    .login-btn:active { transform: translateY(0); }

    .login-btn:disabled {
      background: #94A3B8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.08);
      color: #B91C1C;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      font-weight: 500;
      border: 1px solid rgba(239, 68, 68, 0.18);
    }

    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
    }

    .footer-links a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <img src="/wetzelcrm/logo.png" alt="Wetzel CRM" class="login-logo" onerror="this.closest('.login-brand').innerHTML='<span class=\'brand-mark\'>W</span><span class=\'brand-name\'>WetzelCRM</span>'">
    </div>

    <div class="login-card">
      <div class="card-header">
        <h1>Welcome back</h1>
        <p>Sign in to your CRM workspace</p>
      </div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div id="errorMsg" class="error-msg"></div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="your username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      </form>
    </div>

    <div class="footer-links">
      <a href="/wetzelcrm">← Back to WetzelCRM</a> &nbsp;·&nbsp; <a href="/">wetzelwest.com</a>
    </div>
  </div>

  <script>
    const CRM_SERVER = 'https://crm.wetzelwest.com';

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errDiv.style.display = 'none';

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          signal: controller.signal,
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        clearTimeout(timeoutId);

        if (response.status === 502 || response.status === 503 || response.status === 504) {
          errDiv.textContent = 'CRM server is offline. Please try again later.';
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        const data = await response.json();

        if (response.ok && data.success) {
          const mainUrl = CRM_SERVER ? CRM_SERVER + '/' : '/';
          window.location.href = mainUrl;
        } else {
          errDiv.textContent = data.error || 'Invalid credentials';
          errDiv.style.display = 'block';
        }
      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') {
          errDiv.textContent = 'CRM server is offline or not responding.';
        } else {
          errDiv.textContent = 'Connection error. Please try again.';
        }
        errDiv.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  </script>
</body>
</html>
