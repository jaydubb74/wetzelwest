<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WetzelCRM — Login</title>
  <meta name="description" content="WetzelCRM — Sign in to your CRM." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #3d4d5d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-logo {
      width: 180px;
      height: auto;
      margin-bottom: 30px;
    }

    .login-form { text-align: left; }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #2c3e50;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e6ed;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3498db;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .login-btn:hover { background: #2980b9; }
    .login-btn:disabled { background: #95a5a6; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: #fee;
      color: #c0392b;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .footer-links {
      margin-top: 24px;
      font-size: 13px;
      color: #95a5a6;
    }

    .footer-links a {
      color: #7f8c8d;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: #3498db; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="/wetzelcrm/logo.png" alt="Wetzel CRM" class="login-logo" onerror="this.style.display='none'">
    <form class="login-form" onsubmit="handleLogin(event)">
      <div id="errorMsg" class="error-msg"></div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>
    <div class="footer-links">
      <a href="/wetzelcrm">← Back to WetzelCRM</a> &nbsp;|&nbsp; <a href="/">wetzelwest.com</a>
    </div>
  </div>

  <script>
    // CRM server URL — update this after setting up Cloudflare Tunnel
    const CRM_SERVER = '';  // Leave empty for same-origin, or set to tunnel URL

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errDiv.style.display = 'none';

      try {
        const loginUrl = CRM_SERVER ? CRM_SERVER + '/api/login' : '/api/login';
        const response = await fetch(loginUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const mainUrl = CRM_SERVER ? CRM_SERVER + '/' : '/';
          window.location.href = mainUrl;
        } else {
          errDiv.textContent = data.error || 'Invalid credentials';
          errDiv.style.display = 'block';
        }
      } catch (error) {
        errDiv.textContent = 'Connection error. Please try again.';
        errDiv.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  </script>
</body>
</html>
